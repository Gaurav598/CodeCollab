services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is required}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      EXECUTION_ENGINE_URL: ${EXECUTION_ENGINE_URL}
      EXECUTION_ENGINE_API_KEY: ${EXECUTION_ENGINE_API_KEY:-}
      EXECUTION_DEFAULT_TIMEOUT_MS: ${EXECUTION_DEFAULT_TIMEOUT_MS:-5000}
      EXECUTION_MAX_TIMEOUT_MS: ${EXECUTION_MAX_TIMEOUT_MS:-10000}
      EXECUTION_RATE_LIMIT_PER_MINUTE: ${EXECUTION_RATE_LIMIT_PER_MINUTE:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-gemini}
      AI_FALLBACK_ORDER: ${AI_FALLBACK_ORDER:-gemini,openai,claude,deepseek}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-24}
      AI_AUTOCOMPLETE_RATE_LIMIT_PER_MINUTE: ${AI_AUTOCOMPLETE_RATE_LIMIT_PER_MINUTE:-90}
      AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-24000}
      AI_MAX_CONTEXT_FILES: ${AI_MAX_CONTEXT_FILES:-8}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  sync-service:
    build:
      context: ./sync-service
    environment:
      PORT: 1234
      REDIS_URL: redis://redis:6379
      BACKEND_INTERNAL_URL: http://backend:8080/api/v1/internal
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DOCUMENT_FLUSH_DEBOUNCE_MS: ${DOCUMENT_FLUSH_DEBOUNCE_MS:-1000}
      DOCUMENT_FLUSH_MAX_WAIT_MS: ${DOCUMENT_FLUSH_MAX_WAIT_MS:-5000}
      AUTHORIZATION_RECHECK_MS: ${AUTHORIZATION_RECHECK_MS:-30000}
    ports:
      - "1234:1234"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SYNC_WS_URL: ${NEXT_PUBLIC_SYNC_WS_URL:-ws://localhost:1234}
        NEXT_PUBLIC_STOMP_WS_URL: ${NEXT_PUBLIC_STOMP_WS_URL:-ws://localhost:8080/api/v1/ws}
        NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL:-}
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
        NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL:-}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SYNC_WS_URL: ${NEXT_PUBLIC_SYNC_WS_URL:-ws://localhost:1234}
      NEXT_PUBLIC_STOMP_WS_URL: ${NEXT_PUBLIC_STOMP_WS_URL:-ws://localhost:8080/api/v1/ws}
      NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      sync-service:
        condition: service_started

volumes:
  redis-data:
